[project]
name = "investimentos-backend"
version = "0.1.0"
description = "Backend do sistema de controle e gestão de investimentos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyxirr>=0.10",
    "openpyxl>=3.1",
    "ofxparse>=0.21",
    "python-multipart>=0.0.9",
    "webauthn>=2.7,<3",
    "httpx>=0.27",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI usa Depends(...) como valor default de parâmetro de
# propósito — é o padrão de injeção de dependência do framework, não
# um bug de "chamada de função em default de argumento".
# DTZ011: todo o domínio financeiro usa datas naive (Transaction.
# transaction_date é `Date`, sem timezone) — usar date.today() é
# consistente com isso; datetime.now(tz=...).date() introduziria uma
# dependência de timezone que o resto do sistema não tem.
ignore = ["B008", "DTZ011"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
