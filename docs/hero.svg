<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Finance Hub</title>
  <desc id="d">Dashboard financeiro pessoal: investimentos em reais e em dólar, controle de gastos e análises, rodando no seu computador.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#132034"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font: 700 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -.5px; }
      .sub { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9fb0c3; }
      .msg { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; opacity: 0; }
      .chip { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
      .line { fill: none; stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
              stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease-out .3s forwards; }
      .cdi { fill: none; stroke: #22c55e; stroke-width: 2; stroke-dasharray: 6 6; opacity: .8; }
      .fill { opacity: 0; animation: fade 1s ease-out 2.6s forwards; }
      .dot { fill: #f0f6fc; opacity: 0; animation: fade .4s ease-out 3.4s forwards, pulse 2s ease-in-out 3.8s infinite; transform-box: fill-box; transform-origin: center; }
      .m1 { fill: #60a5fa; animation: cycle 16s linear 0s infinite; }
      .m2 { fill: #34d399; animation: cycle 16s linear 4s infinite; }
      .m3 { fill: #fbbf24; animation: cycle 16s linear 8s infinite; }
      .m4 { fill: #f472b6; animation: cycle 16s linear 12s infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6); } }
      @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line { animation: none; stroke-dashoffset: 0; }
        .fill, .dot { animation: none; opacity: 1; }
        .m1 { animation: none; opacity: 1; } .m2, .m3, .m4 { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="300" rx="16" fill="url(#bg)"/>

  <!-- gráfico -->
  <g transform="translate(560 40)">
    <path class="fill" d="M0 190 L40 176 L80 182 L120 160 L160 166 L200 138 L240 146 L280 112 L320 120 L352 30 L352 210 L0 210 Z" fill="url(#area)"/>
    <path class="cdi" d="M0 196 L352 120"/>
    <path class="line" d="M0 190 L40 176 L80 182 L120 160 L160 166 L200 138 L240 146 L280 112 L320 120 L352 30"/>
    <circle class="dot" cx="352" cy="30" r="5"/>
  </g>

  <!-- texto -->
  <text x="48" y="92" class="title">Finance Hub</text>
  <text x="48" y="128" class="sub">Seu dinheiro explicado, num lugar só.</text>
  <text x="48" y="153" class="sub">Rodando no seu computador.</text>

  <text x="48" y="206" class="msg m1">Reais e dólares lado a lado, sem conversão escondida</text>
  <text x="48" y="206" class="msg m2">Fatura em PDF conferida centavo a centavo</text>
  <text x="48" y="206" class="msg m3">Sua carteira contra o CDI, com os mesmos aportes</text>
  <text x="48" y="206" class="msg m4">Um jornal da carteira toda manhã, escrito pelo Claude</text>

  <g transform="translate(48 236)">
    <rect width="78" height="28" rx="14" fill="#1f2a37"/><text x="39" y="19" text-anchor="middle" class="chip">Python</text>
    <rect x="88" width="86" height="28" rx="14" fill="#1f2a37"/><text x="131" y="19" text-anchor="middle" class="chip">FastAPI</text>
    <rect x="184" width="100" height="28" rx="14" fill="#1f2a37"/><text x="234" y="19" text-anchor="middle" class="chip">PostgreSQL</text>
    <rect x="294" width="70" height="28" rx="14" fill="#1f2a37"/><text x="329" y="19" text-anchor="middle" class="chip">React</text>
    <rect x="374" width="112" height="28" rx="14" fill="#1f2a37"/><text x="430" y="19" text-anchor="middle" class="chip">2.050 testes</text>
  </g>
</svg>
